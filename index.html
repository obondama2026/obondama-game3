<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>当てろ！お盆玉サバイバル 試作版</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
}

body{
background:
radial-gradient(circle at top,#12345d 0%,#061224 45%,#01060f 100%);
overflow:hidden;
height:100vh;
color:#fff;
}

#title{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:10;
}

h1{
font-size:2.6rem;
color:#ffd54f;
text-shadow:
0 0 8px #ff9800,
0 0 18px #ff9800,
0 0 35px #ffeb3b;
animation:titleGlow 2s infinite;
}

button{
margin-top:35px;
padding:18px 45px;
font-size:1.3rem;
font-weight:bold;
border:none;
border-radius:18px;
background:#ff9800;
color:#fff;
box-shadow:0 0 18px orange;
transition:.12s;
cursor:pointer;
}

button:active{
transform:scale(.92);
}

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

.lantern{
position:absolute;
top:18px;
font-size:36px;
animation:swing 2.8s ease-in-out infinite;
transform-origin:top center;
}

@keyframes swing{
0%{transform:rotate(-5deg);}
50%{transform:rotate(5deg);}
100%{transform:rotate(-5deg);}
}

@keyframes twinkle{
0%,100%{opacity:.2;}
50%{opacity:1;}
}

@keyframes titleGlow{
0%,100%{
text-shadow:0 0 10px orange;
}
50%{
text-shadow:
0 0 18px yellow,
0 0 40px orange;
}
}
</style>

</head>

<body>


<div id="title">

<h1>
🏮 当てろ！<br>
⅙お盆玉サバイバル！ 🏮
</h1>

<button onclick="startGame()">
ゲームスタート
</button>

</div>
<script>

function startGame(){
    
}

for(let i=0;i<80;i++){

    const star=document.createElement("div");
    star.className="star";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=(Math.random()*3)+"s";

    document.body.appendChild(star);

}

for(let i=0;i<6;i++){

    const lantern=document.createElement("div");

    lantern.className="lantern";

    lantern.innerHTML="🏮";

    lantern.style.left=(8+i*15)+"%";

    lantern.style.animationDelay=(i*.2)+"s";

    document.body.appendChild(lantern);

}

</script>
</body>
</html>
